# render.yaml — Render.com Blueprint for Scraper Premium
# Deploy:
#   1. Push this repo to GitHub
#   2. render.com → New → Blueprint → connect repo
#   3. Set the "sync: false" env vars in the Render dashboard
#   4. Click Apply

services:

  # ── 1. Flask Backend ─────────────────────────────────────────────────
  - type: web
    name: scraper-premium-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    region: oregon
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: "5000"
      - key: SCRAPER_STORAGE_DIR
        value: /opt/render/project/src/storage

      # Set these in Render Dashboard
      - key: ADMIN_PASSWORD
        sync: false
      - key: SCRAPER_WORKER_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # Set to worker's public URL after worker deploys
      - key: SCRAPER_WORKER_URL
        sync: false

      - key: SCRAPER_WORKER_PORT
        value: "4001"

      - key: GROQ_API_KEY
        sync: false

      - key: DEFAULT_DAILY_LIMIT
        value: "500"
      - key: DEFAULT_JOB_LIMIT
        value: "100"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: REQUEST_DELAY_MS
        value: "2000"
      - key: PAGE_LOAD_TIMEOUT_MS
        value: "30000"
      - key: HEADLESS
        value: "true"

  # ── 2. Node.js Playwright Worker ─────────────────────────────────────
  - type: web
    name: scraper-premium-worker
    runtime: docker
    dockerfilePath: scraper-engine/Dockerfile
    region: oregon
    plan: starter
    autoDeploy: true

    envVars:
      - key: SCRAPER_WORKER_PORT
        value: "4001"
      - key: PORT
        value: "4001"
      - key: SCRAPER_WORKER_TOKEN
        sync: false
      - key: HEADLESS
        value: "true"
      - key: REQUEST_DELAY_MS
        value: "2000"
      - key: PAGE_LOAD_TIMEOUT_MS
        value: "30000"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: SCRAPER_STORAGE_DIR
        value: /opt/render/project/src/storage
